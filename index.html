<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-0: #080b12;
      --bg-1: #0d1117;
      --bg-2: #141926;
      --bg-3: #1c2235;
      --bg-card: #131826;
      --bg-hover: #1a2038;
      --bg-input: #0f1420;
      --border: rgba(99,120,180,0.12);
      --border-md: rgba(99,120,180,0.22);
      --border-bright: rgba(99,120,180,0.4);
      --text-1: #e8eaf2;
      --text-2: #8892b0;
      --text-3: #4d5a7c;
      --blue: #4f8ef7;
      --blue-dim: rgba(79,142,247,0.15);
      --purple: #9b6ef5;
      --purple-dim: rgba(155,110,245,0.15);
      --green: #34d399;
      --green-dim: rgba(52,211,153,0.12);
      --red: #f56565;
      --red-dim: rgba(245,101,101,0.12);
      --amber: #fbbf24;
      --amber-dim: rgba(251,191,36,0.12);
      --cyan: #22d3ee;
      --pink: #ec4899;
      --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-xl: 18px;
      --font: 'DM Sans', system-ui, sans-serif;
      --mono: 'DM Mono', monospace;
      --transition: 180ms ease;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:var(--font); background:var(--bg-0); color:var(--text-1); min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased; }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(79,142,247,0.06) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 40% at 80% 100%, rgba(155,110,245,0.05) 0%, transparent 60%);
    }
    .app { position:relative; z-index:1; max-width:1440px; margin:0 auto; padding:28px 28px 60px; }

    /* HEADER */
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:36px; gap:16px; flex-wrap:wrap; }
    .logo { display:flex; align-items:center; gap:14px; }
    .logo-icon { width:40px; height:40px; background:linear-gradient(135deg,var(--blue),var(--purple)); border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .logo-icon svg { width:22px; height:22px; color:#fff; }
    .logo h1 { font-size:1.25rem; font-weight:600; letter-spacing:-0.02em; color:var(--text-1); }
    .logo span { color:var(--text-3); font-weight:400; font-size:0.875rem; margin-top:1px; display:block; }
    .header-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; gap:7px; padding:9px 16px; font-family:var(--font); font-size:0.8125rem; font-weight:500; border-radius:var(--radius-md); border:1px solid transparent; cursor:pointer; transition:var(--transition); letter-spacing:-0.01em; white-space:nowrap; }
    .btn svg { width:15px; height:15px; flex-shrink:0; }
    .btn-primary { background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:0 1px 3px rgba(79,142,247,0.3),0 4px 16px rgba(79,142,247,0.15); }
    .btn-primary:hover { background:#3a7df6; transform:translateY(-1px); box-shadow:0 2px 8px rgba(79,142,247,0.4),0 4px 20px rgba(79,142,247,0.2); }
    .btn-ghost { background:var(--bg-2); color:var(--text-2); border-color:var(--border); }
    .btn-ghost:hover { color:var(--text-1); border-color:var(--border-md); background:var(--bg-3); }
    .btn-ghost:active { transform:scale(0.98); }
    .btn-danger { background:var(--red); color:#fff; border-color:var(--red); }
    .btn-danger:hover { background:#e05252; transform:translateY(-1px); }
    .btn-icon-only { padding:8px; background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-md); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-2); transition:var(--transition); }
    .btn-icon-only:hover { color:var(--text-1); border-color:var(--border-md); background:var(--bg-3); }
    .btn-icon-only svg { width:16px; height:16px; }
    .btn.loading { opacity:0.55; pointer-events:none; }
    .btn.loading .spin { animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* TABS */
    nav.tabs { display:flex; gap:2px; background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius-lg); padding:4px; width:fit-content; margin-bottom:28px; }
    .tab-btn { padding:9px 22px; background:transparent; border:none; color:var(--text-3); font-family:var(--font); font-size:0.875rem; font-weight:500; border-radius:var(--radius-md); cursor:pointer; transition:var(--transition); letter-spacing:-0.01em; }
    .tab-btn:hover { color:var(--text-2); background:var(--bg-2); }
    .tab-btn.active { background:var(--bg-3); color:var(--text-1); box-shadow:0 1px 4px rgba(0,0,0,0.3); }
    .tab-content { display:none; }
    .tab-content.active { display:block; animation:fadeIn 0.18s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

    /* CARDS */
    .card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px; transition:border-color var(--transition); }
    .card:hover { border-color:var(--border-md); }
    .card-title { font-size:0.8rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-3); margin-bottom:18px; }

    /* STAT CARDS */
    .dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:20px; }
    .stat-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px; transition:all var(--transition); position:relative; overflow:hidden; }
    .stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(99,120,180,0.2),transparent); }
    .stat-card:hover { border-color:var(--border-md); transform:translateY(-2px); }
    .stat-card.accent-positive { border-left:2px solid var(--green); }
    .stat-card.accent-negative { border-left:2px solid var(--red); }
    .stat-card.accent-blue { border-left:2px solid var(--blue); }
    .stat-card.accent-purple { border-left:2px solid var(--purple); }
    .stat-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .stat-label { font-size:0.75rem; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:var(--text-3); }
    .stat-icon { width:18px; height:18px; color:var(--text-3); }
    .stat-value { font-size:1.75rem; font-weight:600; letter-spacing:-0.03em; color:var(--text-1); font-variant-numeric:tabular-nums; line-height:1.1; }
    .stat-sub { font-size:0.8rem; color:var(--text-3); margin-top:5px; font-variant-numeric:tabular-nums; }
    .stat-sub.positive { color:var(--green); }
    .stat-sub.negative { color:var(--red); }

    /* DASHBOARD SECONDARY */
    .dashboard-secondary { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-bottom:20px; }
    .allocation-list { display:flex; flex-direction:column; gap:14px; }
    .allocation-item { display:flex; flex-direction:column; gap:5px; }
    .allocation-info { display:flex; justify-content:space-between; align-items:center; }
    .allocation-name { font-size:0.85rem; font-weight:500; color:var(--text-1); }
    .allocation-pct { font-size:0.8rem; color:var(--text-3); font-variant-numeric:tabular-nums; }
    .alloc-bar { height:4px; background:var(--bg-3); border-radius:2px; overflow:hidden; }
    .alloc-fill { height:100%; background:linear-gradient(90deg,var(--blue),var(--purple)); border-radius:2px; transition:width 0.6s cubic-bezier(0.16,1,0.3,1); }
    .alloc-fill.green { background:linear-gradient(90deg,#34d399,#059669); }
    .alloc-fill.amber { background:linear-gradient(90deg,#fbbf24,#d97706); }
    .allocation-value { font-size:0.75rem; color:var(--text-3); font-family:var(--mono); }
    .performers-list { display:flex; flex-direction:column; gap:8px; }
    .performer-item { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--bg-2); border-radius:var(--radius-md); border:1px solid var(--border); transition:border-color var(--transition); }
    .performer-item:hover { border-color:var(--border-md); }
    .performer-name { font-size:0.85rem; font-weight:500; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
    .performer-value { font-size:0.85rem; font-weight:600; font-family:var(--mono); flex-shrink:0; }
    .performer-item.pos .performer-value { color:var(--green); }
    .performer-item.neg .performer-value { color:var(--red); }
    .last-updated { text-align:center; color:var(--text-3); font-size:0.75rem; margin-top:20px; }

    /* FILTER BAR */
    .filter-bar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
    .search-wrap { position:relative; flex:1; min-width:200px; }
    .search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-3); pointer-events:none; }
    .search-input { width:100%; padding:9px 12px 9px 36px; background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text-1); font-family:var(--font); font-size:0.875rem; transition:var(--transition); }
    .search-input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(79,142,247,0.15); }
    .search-input::placeholder { color:var(--text-3); }
    .filter-select { padding:9px 12px; background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text-2); font-family:var(--font); font-size:0.8125rem; cursor:pointer; transition:var(--transition); }
    .filter-select:focus { outline:none; border-color:var(--blue); }
    .filter-count { font-size:0.75rem; color:var(--text-3); padding:0 4px; white-space:nowrap; }

    /* TABLE */
    .table-wrapper { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
    .table-responsive { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .asset-table { width:100%; border-collapse:collapse; }
    .asset-table thead { position:sticky; top:0; z-index:2; }
    .asset-table th { padding:13px 14px; text-align:left; font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-3); background:var(--bg-2); border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none; transition:color var(--transition); }
    .asset-table th:hover { color:var(--text-2); }
    .asset-table th.sorted { color:var(--blue); }
    .asset-table th:last-child { cursor:default; }
    .asset-table td { padding:13px 14px; font-size:0.8375rem; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:middle; }
    .asset-table tr:last-child td { border-bottom:none; }
    .asset-table tbody tr { transition:background var(--transition); }
    .asset-table tbody tr:hover { background:var(--bg-hover); }
    .cell-name { display:flex; flex-direction:column; gap:2px; }
    .asset-name { font-weight:500; color:var(--text-1); }
    .asset-ticker { font-size:0.7rem; color:var(--text-3); font-family:var(--mono); letter-spacing:0.04em; }
    .asset-note { font-size:0.7rem; color:var(--text-3); font-style:italic; max-width:200px; overflow:hidden; text-overflow:ellipsis; }
    .positive { color:var(--green) !important; }
    .negative { color:var(--red) !important; }
    .badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:0.7rem; font-weight:600; letter-spacing:0.04em; }
    .badge-etf { background:var(--blue-dim); color:var(--blue); }
    .badge-stock { background:var(--purple-dim); color:var(--purple); }
    .badge-crypto { background:var(--amber-dim); color:var(--amber); }
    .badge-fund { background:rgba(34,211,238,0.1); color:var(--cyan); }
    .badge-bond { background:var(--green-dim); color:var(--green); }
    .badge-p2p { background:rgba(236,72,153,0.1); color:var(--pink); }
    .badge-savings { background:rgba(52,211,153,0.1); color:var(--green); }
    .badge-manual { background:rgba(139,148,170,0.1); color:var(--text-2); }
    .mono { font-family:var(--mono); }
    .actions-cell { display:flex; gap:4px; }
    .btn-icon { padding:6px; background:transparent; border:1px solid transparent; border-radius:var(--radius-sm); cursor:pointer; transition:var(--transition); display:flex; align-items:center; justify-content:center; }
    .btn-icon svg { width:15px; height:15px; }
    .btn-edit { color:var(--blue); }
    .btn-edit:hover { background:var(--blue-dim); border-color:rgba(79,142,247,0.3); }
    .btn-delete { color:var(--red); }
    .btn-delete:hover { background:var(--red-dim); border-color:rgba(245,101,101,0.3); }

    /* EMPTY STATE */
    .empty-state-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:72px 20px; text-align:center; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); }
    .empty-icon { width:52px; height:52px; color:var(--text-3); margin-bottom:16px; opacity:0.6; }
    .empty-state-wrap p { color:var(--text-2); margin-bottom:22px; font-size:0.9rem; }
    .empty-list { color:var(--text-3); text-align:center; padding:20px; font-size:0.8rem; }

    /* CHARTS */
    .charts-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
    .chart-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px; }
    .chart-card h3 { font-size:0.8rem; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:var(--text-3); margin-bottom:16px; }
    .chart-container { position:relative; height:280px; }
    .chart-empty { display:flex; align-items:center; justify-content:center; height:280px; color:var(--text-3); font-size:0.8rem; text-align:center; padding:20px; }

    /* MODAL */
    #modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.72); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:1000; opacity:0; visibility:hidden; transition:all 0.18s ease; }
    #modal-overlay.active { opacity:1; visibility:visible; }
    .modal { background:var(--bg-2); border:1px solid var(--border-md); border-radius:var(--radius-xl); width:calc(100% - 40px); max-width:520px; max-height:92vh; overflow-y:auto; box-shadow:0 24px 64px rgba(0,0,0,0.7),0 0 0 1px rgba(99,120,180,0.08); animation:slideUp 0.2s cubic-bezier(0.16,1,0.3,1); }
    .modal-sm { max-width:420px; }
    .modal-lg { max-width:640px; }
    @keyframes slideUp { from { opacity:0; transform:translateY(16px) scale(0.98); } to { opacity:1; transform:none; } }
    .modal-header { display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--border); }
    .modal-header h2 { font-size:1rem; font-weight:600; letter-spacing:-0.01em; }
    .modal-close { background:var(--bg-3); border:1px solid var(--border); color:var(--text-2); width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; transition:var(--transition); }
    .modal-close:hover { color:var(--text-1); border-color:var(--border-md); }
    .modal-body { padding:22px 24px; }
    .modal-body p { color:var(--text-2); font-size:0.875rem; margin-bottom:16px; line-height:1.6; }
    .modal-form { padding:22px 24px; display:flex; flex-direction:column; gap:14px; }
    .form-group { display:flex; flex-direction:column; gap:6px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
    .form-group label { font-size:0.75rem; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-3); }
    .form-group input, .form-group select, .form-group textarea {
      padding:10px 13px; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius-md);
      color:var(--text-1); font-family:var(--font); font-size:0.875rem; transition:var(--transition); appearance:auto;
    }
    .form-group select { -webkit-appearance:auto; }
    .form-group textarea { resize:vertical; min-height:70px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(79,142,247,0.15); }
    .form-group input::placeholder, .form-group textarea::placeholder { color:var(--text-3); }
    .form-hint { font-size:0.75rem; color:var(--text-3); margin-top:4px; }
    .form-section-title { font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-3); padding-bottom:8px; border-bottom:1px solid var(--border); margin-top:4px; }
    .file-input { padding:12px; background:var(--bg-input); border:1px dashed var(--border-md); border-radius:var(--radius-md); color:var(--text-2); width:100%; cursor:pointer; font-family:var(--font); font-size:0.875rem; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; padding:16px 24px; border-top:1px solid var(--border); }

    /* SETTINGS PANEL */
    .settings-section { margin-bottom:28px; }
    .settings-section:last-child { margin-bottom:0; }
    .settings-section h3 { font-size:0.8rem; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:var(--text-3); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border); }
    .setting-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); gap:16px; }
    .setting-row:last-child { border-bottom:none; }
    .setting-label { font-size:0.875rem; font-weight:500; color:var(--text-1); }
    .setting-desc { font-size:0.8rem; color:var(--text-3); margin-top:3px; }
    .platform-tag { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:var(--bg-3); border:1px solid var(--border); border-radius:20px; font-size:0.8rem; color:var(--text-2); }
    .platform-tag button { background:none; border:none; color:var(--text-3); cursor:pointer; display:flex; padding:0; font-size:0.9rem; transition:color var(--transition); }
    .platform-tag button:hover { color:var(--red); }
    .platforms-wrap { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .add-platform-row { display:flex; gap:8px; }
    .add-platform-row input { flex:1; }

    /* KEYBOARD SHORTCUT HINT */
    .kbd { display:inline-flex; align-items:center; justify-content:center; padding:1px 6px; background:var(--bg-3); border:1px solid var(--border-md); border-radius:4px; font-size:0.7rem; font-family:var(--mono); color:var(--text-3); }

    /* TOAST */
    .toast { position:fixed; bottom:28px; right:28px; padding:13px 18px; background:var(--bg-2); border:1px solid var(--border-md); border-radius:var(--radius-lg); box-shadow:0 8px 32px rgba(0,0,0,0.5); font-size:0.8375rem; font-weight:500; z-index:2000; transform:translateY(120px); opacity:0; transition:all 0.3s cubic-bezier(0.16,1,0.3,1); max-width:320px; }
    .toast-show { transform:translateY(0); opacity:1; }
    .toast-success { border-left:3px solid var(--green); }
    .toast-error { border-left:3px solid var(--red); }
    .toast-info { border-left:3px solid var(--blue); }

    /* LOADING OVERLAY */
    .price-loading { display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--text-3); padding:6px 0; }
    .pulse-dot { width:6px; height:6px; border-radius:50%; background:var(--blue); animation:pulse 1s ease infinite; }
    @keyframes pulse { 0%,100% { opacity:0.4; transform:scale(0.8); } 50% { opacity:1; transform:scale(1); } }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:var(--bg-1); }
    ::-webkit-scrollbar-thumb { background:var(--bg-3); border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--border-md); }

    /* RESPONSIVE */
    @media (max-width:1024px) {
      .app { padding:18px; }
      .dashboard-grid { grid-template-columns:repeat(2,1fr); }
      .charts-grid { grid-template-columns:1fr; }
    }
    @media (max-width:768px) {
      header { flex-direction:column; align-items:flex-start; }
      .header-actions { width:100%; }
      .dashboard-grid { grid-template-columns:1fr; }
      .dashboard-secondary { grid-template-columns:1fr; }
      nav.tabs { width:100%; overflow-x:auto; }
      .form-row, .form-row-3 { grid-template-columns:1fr; }
      .modal { margin:16px; }
      .btn { padding:8px 13px; font-size:0.775rem; }
      .filter-bar { flex-direction:column; align-items:stretch; }
    }

    @keyframes flashGreen { 0%,100% { background:transparent; } 50% { background:rgba(52,211,153,0.08); } }

<script>
// ══════════════════════════════════════════════════════════════
// CONSTANTS & DEFAULTS
// ══════════════════════════════════════════════════════════════
const SK = "portfolio_cmd_v2";
const CK = "portfolio_price_cache_v2";
const HK = "portfolio_history_v2";
const CFG_KEY = "portfolio_cfg_v2";
const FX_KEY = "portfolio_fx_v2";

const DEFAULT_PLATFORMS = [

];

const CURRENCIES = ["EUR","USD","GBP","CHF","JPY","CAD","AUD","BRL","PLN","DKK","SEK","NOK"];

const CRYPTO_LIST = {

  ethereum:     { symbol:"ETH", name:"Ethereum" },
  binancecoin:  { symbol:"BNB", name:"BNB" },
  solana:       { symbol:"SOL", name:"Solana" },

  "stellar":    { symbol:"XLM", name:"Stellar" },

  "near":       { symbol:"NEAR", name:"NEAR Protocol" },
  "aptos":      { symbol:"APT", name:"Aptos" },
  "sui":        { symbol:"SUI", name:"Sui" }
};

const TYPE_LABELS = { etf:"ETF",stock:"Stock",crypto:"Crypto",fund:"Fund",bond:"Bond",p2p:"P2P",savings:"Savings",manual:"Manual" };
const SYM = { EUR:"€",USD:"$",GBP:"£",CHF:"CHF ",JPY:"¥",CAD:"C$",AUD:"A$",BRL:"R$",PLN:"zł",DKK:"kr",SEK:"kr",NOK:"kr" };
const LOC = { EUR:"de-DE",USD:"en-US",GBP:"en-GB",CHF:"de-CH",JPY:"ja-JP",CAD:"en-CA",AUD:"en-AU",BRL:"pt-BR",PLN:"pl-PL",DKK:"da-DK",SEK:"sv-SE",NOK:"nb-NO" };

const CHART_COLORS = ["#4f8ef7","#9b6ef5","#34d399","#fbbf24","#f56565","#22d3ee","#ec4899","#6366f1","#14b8a6","#f97316","#84cc16","#a855f7","#0ea5e9","#e11d48","#7c3aed"];

// ══════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════
function loadConfig() {
  try { const d = localStorage.getItem(CFG_KEY); return d ? JSON.parse(d) : {}; } catch { return {}; }
}
function saveConfig(cfg) {
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch {}
}
function getConfig(key, def) {
  const cfg = loadConfig();
  return cfg[key] !== undefined ? cfg[key] : def;
}
function setConfig(key, val) {
  const cfg = loadConfig();
  cfg[key] = val;
  saveConfig(cfg);
}

function getPlatforms() {
  return getConfig("platforms", DEFAULT_PLATFORMS);
}
function getBaseCurrency() {
  return getConfig("baseCurrency", "EUR");
}

// ══════════════════════════════════════════════════════════════
// STORAGE
// ══════════════════════════════════════════════════════════════
function loadPortfolio() {
  try { const d = localStorage.getItem(SK); return d ? JSON.parse(d) : null; } catch { return null; }
}
function savePortfolio(p) {
  try { p.updatedAt = new Date().toISOString(); localStorage.setItem(SK, JSON.stringify(p)); return true; } catch { return false; }
}
function loadPriceCache() {
  try { const d = localStorage.getItem(CK); return d ? JSON.parse(d) : {}; } catch { return {}; }
}
function savePriceCache(c) { try { localStorage.setItem(CK, JSON.stringify(c)); } catch {} }
function getCachedPrice(id) {
  const c = loadPriceCache(); const e = c[id]; if (!e) return null;
  if (Date.now() - e.ts > 5 * 60 * 1000) { delete c[id]; savePriceCache(c); return null; }
  return e.price;
}
function setCachedPrice(id, price) {
  const c = loadPriceCache(); c[id] = { price, ts: Date.now() }; savePriceCache(c);
}
function loadHistory() {
  try { const d = localStorage.getItem(HK); return d ? JSON.parse(d) : []; } catch { return []; }
}
function saveHistoryEntry(val) {
  try {
    const h = loadHistory();
    // Don't save duplicate within same hour
    const lastEntry = h[h.length - 1];
    if (lastEntry) {
      const lastTime = new Date(lastEntry.date).getTime();
      if (Date.now() - lastTime < 30 * 60 * 1000) { h[h.length - 1] = { date: new Date().toISOString(), value: val }; localStorage.setItem(HK, JSON.stringify(h)); return; }
    }
    h.push({ date: new Date().toISOString(), value: val });
    if (h.length > 720) h.splice(0, h.length - 720);
    localStorage.setItem(HK, JSON.stringify(h));
  } catch {}
}

function exportPortfolio(p) {
  const blob = new Blob([JSON.stringify(p, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `portfolio_${new Date().toISOString().split("T")[0]}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function importPortfolio(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      try {
        const p = JSON.parse(e.target.result);
        if (!p.assets || !Array.isArray(p.assets)) return rej(new Error("Invalid format: missing assets array"));
        if (!p.version) p.version = 1;
        res(p);
      } catch { rej(new Error("Failed to parse JSON file")); }
    };
    r.onerror = () => rej(new Error("Failed to read file"));
    r.readAsText(file);
  });
}

// ══════════════════════════════════════════════════════════════
// FX RATES (cache 1h)
// ══════════════════════════════════════════════════════════════
let fxRates = {};
async function fetchFxRates(baseCurrency) {
  const cached = loadFxCache(baseCurrency);
  if (cached) { fxRates = cached; return; }
  try {
    // Use exchangerate-api open endpoint (no key needed for EUR base)
    const base = baseCurrency === "EUR" ? "EUR" : baseCurrency;
    const r = await fetch(`https://open.er-api.com/v6/latest/${base}`);
    if (!r.ok) throw new Error("FX fetch failed");
    const data = await r.json();
    fxRates = data.rates || {};
    fxRates[base] = 1;
    saveFxCache(baseCurrency, fxRates);
  } catch {
    // Fallback: rough static rates relative to EUR
    const EUR_RATES = { EUR:1, USD:1.08, GBP:0.86, CHF:0.96, JPY:163, CAD:1.47, AUD:1.64, BRL:5.5, PLN:4.27, DKK:7.46, SEK:11.5, NOK:11.7 };
    if (baseCurrency === "EUR") { fxRates = EUR_RATES; }
    else {
      const baseRate = EUR_RATES[baseCurrency] || 1;
      fxRates = {};
      for (const [k, v] of Object.entries(EUR_RATES)) fxRates[k] = v / baseRate;
    }
  }
}
function loadFxCache(base) {
  try {
    const d = localStorage.getItem(FX_KEY); if (!d) return null;
    const obj = JSON.parse(d);
    if (obj.base !== base || Date.now() - obj.ts > 3600000) return null;
    return obj.rates;
  } catch { return null; }
}
function saveFxCache(base, rates) {
  try { localStorage.setItem(FX_KEY, JSON.stringify({ base, rates, ts: Date.now() })); } catch {}
}
function convertToBase(amount, fromCurrency, baseCurrency) {
  if (!amount || fromCurrency === baseCurrency) return amount;
  if (!fxRates[fromCurrency]) return amount;
  return amount / fxRates[fromCurrency];
}

// ══════════════════════════════════════════════════════════════
// CALCULATIONS
// ══════════════════════════════════════════════════════════════
function calcGainLoss(asset, currentPrice) {
  const buyPrice = asset.averageBuyPrice ?? asset.manualPrice ?? 0;
  const invested = asset.quantity * buyPrice;
  const currentValue = asset.quantity * currentPrice;
  const gainLoss = currentValue - invested;
  const gainLossPercent = invested > 0 ? (gainLoss / invested) * 100 : 0;
  return { invested, currentValue, gainLoss, gainLossPercent };
}
function calcGainLossInBase(asset, currentPrice, baseCurrency) {
  const { invested, currentValue, gainLoss, gainLossPercent } = calcGainLoss(asset, currentPrice);
  return {
    invested: convertToBase(invested, asset.currency, baseCurrency),
    currentValue: convertToBase(currentValue, asset.currency, baseCurrency),
    gainLoss: convertToBase(gainLoss, asset.currency, baseCurrency),
    gainLossPercent
  };
}
function calcPortfolioMetrics(assets, prices, baseCurrency) {
  let totalInvested = 0, totalCurrentValue = 0;
  const assetMetrics = [];
  for (const a of assets) {
    const cp = prices[a.id] ?? a.manualPrice ?? a.averageBuyPrice ?? 0;
    const m = calcGainLossInBase(a, cp, baseCurrency);
    assetMetrics.push({ ...a, currentPrice: cp, ...m });
    totalInvested += m.invested;
    totalCurrentValue += m.currentValue;
  }
  const totalGainLoss = totalCurrentValue - totalInvested;
  const totalGainLossPercent = totalInvested > 0 ? (totalGainLoss / totalInvested) * 100 : 0;
  return { totalInvested, totalCurrentValue, totalGainLoss, totalGainLossPercent, assets: assetMetrics };
}
function calcAllocation(assets, prices, baseCurrency) {
  const vals = assets.map(a => {
    const cp = prices[a.id] ?? a.manualPrice ?? a.averageBuyPrice ?? 0;
    return convertToBase(a.quantity * cp, a.currency, baseCurrency);
  });
  const total = vals.reduce((s, v) => s + v, 0);
  return assets.map((a, i) => ({
    name: a.name, type: a.type, value: vals[i],
    percentage: total > 0 ? vals[i] / total * 100 : 0
  })).sort((a, b) => b.value - a.value);
}
function calcGroupAllocation(assets, prices, baseCurrency, groupFn, labelFn) {
  const tv = {}; let total = 0;
  for (const a of assets) {
    const cp = prices[a.id] ?? a.manualPrice ?? a.averageBuyPrice ?? 0;
    const v = convertToBase(a.quantity * cp, a.currency, baseCurrency);
    const key = groupFn(a);
    tv[key] = (tv[key] || 0) + v; total += v;
  }
  return Object.entries(tv).map(([key, value]) => ({
    label: labelFn ? labelFn(key) : key, value,
    percentage: total > 0 ? value / total * 100 : 0
  })).sort((a, b) => b.value - a.value);
}
function getTopPerformers(assets, prices, n = 3) {
  return assets.map(a => {
    const cp = prices[a.id] ?? a.manualPrice ?? a.averageBuyPrice ?? 0;
    return { name: a.name, ...calcGainLoss(a, cp) };
  }).sort((a, b) => b.gainLossPercent - a.gainLossPercent).slice(0, n);
}
function getWorstPerformers(assets, prices, n = 3) {
  return assets.map(a => {
    const cp = prices[a.id] ?? a.manualPrice ?? a.averageBuyPrice ?? 0;
    return { name: a.name, ...calcGainLoss(a, cp) };
  }).sort((a, b) => a.gainLossPercent - b.gainLossPercent).slice(0, n);
}

// ══════════════════════════════════════════════════════════════
// FORMATTING
// ══════════════════════════════════════════════════════════════
function fmtCurrency(amount, currency = "EUR", dec = 2) {
  const sym = SYM[currency] || currency + " ";
  const loc = LOC[currency] || "en-US";
  const abs = Math.abs(amount || 0);
  const fmt = new Intl.NumberFormat(loc, { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(abs);
  return (amount < 0 ? "-" : "") + sym + fmt;
}
function fmtPct(v, dec = 2) { return (v >= 0 ? "+" : "") + (v || 0).toFixed(dec) + "%"; }
function fmtCompact(amount, currency = "EUR") {
  const sym = SYM[currency] || currency + " ";
  const abs = Math.abs(amount || 0); const sign = amount < 0 ? "-" : "";
  if (abs >= 1e6) return `${sign}${sym}${(abs/1e6).toFixed(2)}M`;
  if (abs >= 1000) return `${sign}${sym}${(abs/1000).toFixed(2)}K`;
  return fmtCurrency(amount, currency);
}
function fmtQty(v) {
  if (!v) return "0";
  if (Number.isInteger(v)) return v.toLocaleString();
  if (v < 0.01) return v.toFixed(6);
  if (v < 1) return v.toFixed(4);
  return v.toFixed(2);
}
function fmtRelative(ds) {
  if (!ds) return "N/A";
  const d = new Date(ds); const now = new Date(); const ms = now - d;
  const mins = Math.floor(ms/60000);
  if (mins < 1) return "Just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(ms/3600000);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(ms/86400000);
  if (days < 7) return `${days}d ago`;
  return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
}

// ══════════════════════════════════════════════════════════════
// PRICE FETCHING
// ══════════════════════════════════════════════════════════════
async function fetchCryptoPrices(assets, baseCur) {
  const ids = [...new Set(assets.map(a => a.providerId))];
  // Try each currency group separately
  const byCur = {};
  for (const a of assets) {
    const c = (a.currency || "eur").toLowerCase();
    (byCur[c] = byCur[c] || []).push(a);
  }
  const result = {};
  for (const [cur, curAssets] of Object.entries(byCur)) {
    const curIds = [...new Set(curAssets.map(a => a.providerId))];
    try {
      const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${curIds.join(",")}&vs_currencies=${cur}`);
      if (!r.ok) throw new Error("CoinGecko " + r.status);
      const data = await r.json();
      for (const a of curAssets) {
        if (data[a.providerId]?.[cur] !== undefined) result[a.id] = data[a.providerId][cur];
      }
    } catch (e) { console.warn("CoinGecko:", e.message); }
  }
  return result;
}

async function fetchStockPrice(ticker) {
  const cached = null; // will be checked before call
  try {
    const r = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=1d`);
    if (!r.ok) throw new Error("Yahoo " + r.status);
    const data = await r.json();
    return data.chart?.result?.[0]?.meta?.regularMarketPrice ?? null;
  } catch (e) { console.warn("Yahoo:", ticker, e.message); return null; }
}

async function fetchAllPrices(assets) {
  const prices = {};

  // Crypto (batch by currency)
  const cryptoAssets = assets.filter(a => a.provider === "coingecko" && a.providerId);
  if (cryptoAssets.length > 0) {
    const cp = await fetchCryptoPrices(cryptoAssets);
    Object.assign(prices, cp);
    for (const [id, price] of Object.entries(cp)) setCachedPrice(id, price);
  }

  // Stocks (sequential with cache)
  const stockAssets = assets.filter(a => a.provider === "yahoo" && a.ticker);
  for (const a of stockAssets) {
    const cached = getCachedPrice(a.id);
    if (cached !== null) { prices[a.id] = cached; continue; }
    const p = await fetchStockPrice(a.ticker);
    if (p !== null) { prices[a.id] = p; setCachedPrice(a.id, p); }
  }

  // Manual / savings / p2p / bond / fund without provider
  for (const a of assets.filter(a => !a.provider || a.type === "manual" || a.type === "savings" || a.type === "p2p")) {
    prices[a.id] = a.manualPrice ?? a.averageBuyPrice ?? 0;
  }

  return prices;
}

// ══════════════════════════════════════════════════════════════
// MODAL ENGINE
// ══════════════════════════════════════════════════════════════
function showModal(html) {
  const ov = document.getElementById("modal-overlay");
  const ct = document.getElementById("modal-container");
  ct.innerHTML = html;
  ov.classList.add("active");
  document.body.style.overflow = "hidden";
  const overlayHandler = e => { if (e.target === ov) hideModal(); };
  const escHandler = e => { if (e.key === "Escape") hideModal(); };
  ov.addEventListener("click", overlayHandler);
  document.addEventListener("keydown", escHandler);
  ov._cleanup = () => { ov.removeEventListener("click", overlayHandler); document.removeEventListener("keydown", escHandler); };
}
function hideModal() {
  const ov = document.getElementById("modal-overlay");
  ov.classList.remove("active");
  document.body.style.overflow = "";
  if (ov._cleanup) { ov._cleanup(); delete ov._cleanup; }
}

// ASSET MODAL
// ══════════════════════════════════════════════════════════════
function showAssetModal(asset, onSave) {

  const platforms = getPlatforms();
  const html = `

        </div>
        <div id="interest-group" style="display:none">
          <div class="form-row">
            <div class="form-group">
              <label>Annual Interest Rate (%)</label>
              <input type="number" id="a-interest" step="0.01" min="0" max="100" value="${asset?.interestRate||""}" placeholder="e.g., 3.5">

            <div class="form-group">
              <label>Maturity / End Date</label>
              <input type="date" id="a-maturity" value="${asset?.maturityDate||""}">
            </div>
          </div>
        </div>
        <div id="crypto-fields" style="display:none">
          <div class="form-group">
            <label>Cryptocurrency</label>
            <select id="a-provid">
              <option value="">— select cryptocurrency —</option>
              ${Object.entries(CRYPTO_LIST).map(([id,info]) =>
                `<option value="${id}"${asset?.providerId===id?" selected":""}>${info.name} (${info.symbol})</option>`
              ).join("")}
            </select>
          </div>
        </div>
        <div id="stock-fields" style="display:none">
          <div class="form-row">
            <div class="form-group">
              <label>Ticker Symbol</label>
              <input type="text" id="a-ticker" value="${asset?.ticker||""}" placeholder="e.g., VWCE.DE">
            </div>
            <div class="form-group">
              <label>ISIN (optional)</label>
              <input type="text" id="a-isin" value="${asset?.isin||""}" placeholder="IE00BK5BQT80">
            </div>
          </div>
        </div>
        <div class="form-group" id="platform-group">
          <label>Platform / Broker</label>
          <select id="a-platform">
            <option value="">— none —</option>
            ${platforms.map(p => `<option value="${p}"${asset?.platform===p?" selected":""}>${p}</option>`).join("")}
          </select>
        </div>
        <div class="form-group">
          <label>Notes (optional)</label>
          <textarea id="a-notes" placeholder="Any notes about this position…">${asset?.notes||""}</textarea>
        </div>

          <button type="button" class="btn btn-ghost" id="mc2">Cancel</button>
          <button type="submit" class="btn btn-primary">${isEdit ? "Save Changes" : "Add Asset"}</button>
        </div>
      </form>
    </div>`;
  showModal(html);
  document.getElementById("mc").addEventListener("click", hideModal);
  document.getElementById("mc2").addEventListener("click", hideModal);
  const typeEl = document.getElementById("a-type");
  updateAssetFormFields(typeEl.value);
  typeEl.addEventListener("change", e => updateAssetFormFields(e.target.value));
  // Auto-fill name from crypto selection
  document.getElementById("a-provid")?.addEventListener("change", e => {
    const info = CRYPTO_LIST[e.target.value];
    if (info && !document.getElementById("a-name").value) {
      document.getElementById("a-name").value = info.name;
    }
  });
  document.getElementById("asset-form").addEventListener("submit", e => {
    e.preventDefault();
    onSave(collectAssetFormData(asset));
    hideModal();
  });
}

function updateAssetFormFields(type) {
  document.getElementById("crypto-fields").style.display = type === "crypto" ? "block" : "none";
  document.getElementById("stock-fields").style.display = (type === "etf" || type === "stock") ? "block" : "none";
  document.getElementById("interest-group").style.display = (type === "savings" || type === "p2p" || type === "bond") ? "block" : "none";
  document.getElementById("price-label").textContent = type === "manual" || type === "savings" || type === "p2p" ? "Current Price / Unit" : "Avg Buy Price";
  const priceInput = document.getElementById("a-price");
  if (type === "manual" || type === "savings" || type === "p2p") priceInput.removeAttribute("required");
  else priceInput.setAttribute("required", "");
}

function collectAssetFormData(asset) {
  const type = document.getElementById("a-type").value;
  const data = {
    id: asset?.id || crypto.randomUUID(), type,
    name: document.getElementById("a-name").value.trim(),
    quantity: parseFloat(document.getElementById("a-qty").value) || 0,
    currency: document.getElementById("a-cur").value,
    platform: document.getElementById("a-platform").value || undefined,
    notes: document.getElementById("a-notes").value.trim() || undefined
  };
  const priceVal = parseFloat(document.getElementById("a-price").value);
  if (type === "manual" || type === "savings" || type === "p2p") {
    data.manualPrice = isNaN(priceVal) ? (asset?.manualPrice || 1) : priceVal;
  } else {
    if (!isNaN(priceVal)) data.averageBuyPrice = priceVal;
  }
  if (type === "savings" || type === "p2p" || type === "bond") {
    const ir = parseFloat(document.getElementById("a-interest").value);
    if (!isNaN(ir)) data.interestRate = ir;
    data.maturityDate = document.getElementById("a-maturity").value || undefined;
  }
  if (type === "crypto") {
    const pid = document.getElementById("a-provid").value;
    if (pid) {
      data.provider = "coingecko"; data.providerId = pid;
      if (CRYPTO_LIST[pid]) { data.symbol = CRYPTO_LIST[pid].symbol; if (!data.name) data.name = CRYPTO_LIST[pid].name; }
    }
  }
  if (type === "etf" || type === "stock") {
    data.provider = "yahoo";
    data.ticker = document.getElementById("a-ticker").value.trim().toUpperCase() || undefined;
    data.isin = document.getElementById("a-isin").value.trim() || undefined;
  }
  return data;
}

window.removePlatform = function(name) {
  const plats = getPlatforms().filter(p => p !== name);
  setConfig("platforms", plats);
  const tag = document.querySelector(`.platform-tag[data-platform="${name}"]`);
  if (tag) tag.remove();
};

// TABLE
// ══════════════════════════════════════════════════════════════
let sortKey = "currentValue", sortDir = -1;
let tableFilter = "", tableTypeFilter = "";

function renderTable(portfolio, prices, onEdit, onDelete) {
  const baseCurrency = getBaseCurrency();
  const ct = document.getElementById("table-content");
  if (!ct) return;

  if (portfolio.assets.length === 0) {
    ct.innerHTML = `
      <div class="empty-state-wrap">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        <p>No assets in your portfolio yet</p>
        <button class="btn btn-primary" onclick="window.showAddAssetModal()">Add your first asset</button>
      </div>`;
    return;
  }

  // Filter
  let filtered = portfolio.assets.filter(a => {
    const q = tableFilter.toLowerCase();
    if (q && !a.name.toLowerCase().includes(q) && !(a.ticker||"").toLowerCase().includes(q) && !(a.platform||"").toLowerCase().includes(q)) return false;
    if (tableTypeFilter && a.type !== tableTypeFilter) return false;
    return true;
  });

  // Sort
  filtered = filtered.slice().sort((a, b) => {
    const cpA = prices[a.id] ?? a.manualPrice ?? a.averageBuyPrice ?? 0;
    const cpB = prices[b.id] ?? b.manualPrice ?? b.averageBuyPrice ?? 0;
    const mA = calcGainLossInBase(a, cpA, baseCurrency);
    const mB = calcGainLossInBase(b, cpB, baseCurrency);
    let va, vb;
    switch (sortKey) {
      case "name": return sortDir * a.name.localeCompare(b.name);
      case "type": return sortDir * a.type.localeCompare(b.type);
      case "platform": return sortDir * (a.platform||"").localeCompare(b.platform||"");
      case "qty": va = a.quantity; vb = b.quantity; break;
      case "avgPrice": va = a.averageBuyPrice??a.manualPrice??0; vb = b.averageBuyPrice??b.manualPrice??0; break;
      case "currentPrice": va = cpA; vb = cpB; break;
      case "invested": va = mA.invested; vb = mB.invested; break;
      case "currentValue": va = mA.currentValue; vb = mB.currentValue; break;
      case "gainLoss": va = mA.gainLoss; vb = mB.gainLoss; break;
      case "gainLossPercent": va = mA.gainLossPercent; vb = mB.gainLossPercent; break;
      default: return 0;
    }
    return sortDir * (va - vb);
  });

  const th = (key, label) =>
    `<th data-sort="${key}" class="${sortKey===key?"sorted":""}">${label} ${sortKey===key?(sortDir>0?"↑":"↓"):""}</th>`;

  ct.innerHTML = `
    <div class="filter-bar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="tbl-search" placeholder="Search by name, ticker, platform…" value="${tableFilter}">
      </div>
      <select class="filter-select" id="tbl-type">
        <option value="">All types</option>
        ${ASSET_TYPES.map(t => `<option value="${t.value}"${tableTypeFilter===t.value?" selected":""}>${t.label}</option>`).join("")}
      </select>
      <span class="filter-count">${filtered.length} / ${portfolio.assets.length} assets</span>
    </div>
    <div class="table-wrapper">
      <div class="table-responsive">
        <table class="asset-table">
          <thead><tr>
            ${th("name","Name")}
            ${th("type","Type")}
            ${th("platform","Platform")}
            ${th("qty","Qty")}
            ${th("avgPrice","Buy Price")}
            ${th("currentPrice","Current")}
            ${th("invested","Invested")}
            ${th("currentValue","Value (${baseCurrency})")}
            ${th("gainLoss","Gain/Loss")}
            ${th("gainLossPercent","G/L %")}
            <th>Actions</th>
          </tr></thead>
          <tbody>
            ${filtered.map(a => {
              const cp = prices[a.id] ?? a.manualPrice ?? a.averageBuyPrice ?? 0;
              const { invested, currentValue, gainLoss, gainLossPercent } = calcGainLossInBase(a, cp, baseCurrency);
              const gc = gainLoss >= 0 ? "positive" : "negative";
              const fxNote = a.currency !== baseCurrency ? `<span class="fx-badge">${a.currency}</span>` : "";
              return `
                <tr data-id="${a.id}">
                  <td><div class="cell-name">
                    <span class="asset-name">${a.name}</span>
                    ${a.ticker ? `<span class="asset-ticker">${a.ticker}</span>` : ""}
                    ${a.symbol && !a.ticker ? `<span class="asset-ticker">${a.symbol}</span>` : ""}
                    ${a.notes ? `<span class="asset-note" title="${a.notes}">${a.notes}</span>` : ""}
                  </div></td>
                  <td><span class="badge badge-${a.type}">${TYPE_LABELS[a.type]||a.type}</span></td>
                  <td style="color:var(--text-2)">${a.platform||"—"}</td>
                  <td class="mono" style="color:var(--text-2)">${fmtQty(a.quantity)}</td>
                  <td class="mono">${fmtCurrency(a.averageBuyPrice??a.manualPrice??0, a.currency)}${fxNote}</td>
                  <td class="mono" style="color:var(--text-1);font-weight:500">${fmtCurrency(cp, a.currency)}${fxNote}</td>
                  <td class="mono" style="color:var(--text-2)">${fmtCurrency(invested, baseCurrency)}</td>
                  <td class="mono" style="font-weight:500">${fmtCurrency(currentValue, baseCurrency)}</td>
                  <td class="mono ${gc}">${gainLoss>=0?"+":""}${fmtCurrency(gainLoss, baseCurrency)}</td>
                  <td class="mono ${gc}" style="font-weight:600">${fmtPct(gainLossPercent)}${a.interestRate ? ` <span style="color:var(--text-3);font-weight:400;font-size:0.7rem">(${a.interestRate}%/yr)</span>` : ""}</td>
                  <td class="actions-cell">
                    <button class="btn-icon btn-edit" data-action="edit" data-id="${a.id}" title="Edit">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button class="btn-icon btn-delete" data-action="delete" data-id="${a.id}" title="Delete">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                  </td>
                </tr>`;
            }).join("")}
            ${filtered.length === 0 ? `<tr><td colspan="11" style="text-align:center;color:var(--text-3);padding:40px">No assets match your filter</td></tr>` : ""}
          </tbody>
        </table>
      </div>
    </div>`;

  // Search & filter events
  document.getElementById("tbl-search").addEventListener("input", e => {
    tableFilter = e.target.value;
    renderTable(portfolio, prices, onEdit, onDelete);
  });
  document.getElementById("tbl-type").addEventListener("change", e => {
    tableTypeFilter = e.target.value;
    renderTable(portfolio, prices, onEdit, onDelete);
  });
  ct.querySelectorAll("[data-action='edit']").forEach(b => b.addEventListener("click", () => onEdit(b.dataset.id)));
  ct.querySelectorAll("[data-action='delete']").forEach(b => b.addEventListener("click", () => onDelete(b.dataset.id)));
  ct.querySelectorAll("th[data-sort]").forEach(th => th.addEventListener("click", () => {
    if (sortKey === th.dataset.sort) sortDir *= -1; else { sortKey = th.dataset.sort; sortDir = -1; }
    renderTable(portfolio, prices, onEdit, onDelete);
  }));
}

// ══════════════════════════════════════════════════════════════
// CHARTS
// ══════════════════════════════════════════════════════════════
let allocChart = null, typeChart = null, platformChart = null, evoChart = null;
const TOOLTIP = { backgroundColor:"#141926", titleColor:"#e8eaf2", bodyColor:"#8892b0", borderColor:"rgba(99,120,180,0.22)", borderWidth:1, cornerRadius:10, padding:12 };

function destroyCharts() {
  [allocChart, typeChart, platformChart, evoChart].forEach(c => { if(c) { try { c.destroy(); } catch {} } });
  allocChart = typeChart = platformChart = evoChart = null;
}

function renderCharts(portfolio, prices, history) {
  const baseCurrency = getBaseCurrency();
  renderAllocChart(portfolio, prices, baseCurrency);
  renderTypeChart(portfolio, prices, baseCurrency);
  renderPlatformChart(portfolio, prices, baseCurrency);
  renderEvoChart(history, baseCurrency);
}

function makeDoughnut(ctxId, labels, data, currency, chartRef) {
  const el = document.getElementById(ctxId); if (!el) return null;
  if (chartRef) chartRef.destroy();
  if (!data.length) { el.parentElement.innerHTML = '<div class="chart-empty">No data to display</div>'; return null; }
  return new Chart(el, {
    type:"doughnut",
    data:{ labels, datasets:[{ data, backgroundColor:CHART_COLORS.slice(0,data.length), borderWidth:0, hoverOffset:8 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:"65%", plugins:{
      legend:{ position:"right", labels:{ color:"#8892b0", padding:12, usePointStyle:true, pointStyleWidth:8, font:{size:11} } },
      tooltip:{ ...TOOLTIP, callbacks:{ label: ctx2 => {
        const total = ctx2.dataset.data.reduce((a,b)=>a+b,0);
        return ` ${fmtCurrency(ctx2.parsed, currency)} (${(ctx2.parsed/total*100).toFixed(1)}%)`;
      }}}
    }}
  });
}

function renderAllocChart(portfolio, prices, baseCurrency) {
  const alloc = calcAllocation(portfolio.assets, prices, baseCurrency);
  allocChart = makeDoughnut("allocation-chart", alloc.map(a=>a.name), alloc.map(a=>a.value), baseCurrency, allocChart);
}

function renderTypeChart(portfolio, prices, baseCurrency) {
  const ta = calcGroupAllocation(portfolio.assets, prices, baseCurrency, a=>a.type, t=>TYPE_LABELS[t]||t);
  const el = document.getElementById("type-chart"); if (!el) return;
  if (typeChart) typeChart.destroy();
  if (!ta.length) { el.parentElement.innerHTML = '<div class="chart-empty">No data</div>'; return; }
  typeChart = new Chart(el, {
    type:"bar",
    data:{ labels:ta.map(t=>t.label), datasets:[{ data:ta.map(t=>t.value), backgroundColor:CHART_COLORS.slice(0,ta.length), borderRadius:8, borderSkipped:false }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{...TOOLTIP, callbacks:{label:c=>` ${fmtCurrency(c.parsed.y, baseCurrency)}`}} },
      scales:{ x:{grid:{display:false}, ticks:{color:"#8892b0",font:{size:11}}}, y:{grid:{color:"rgba(99,120,180,0.07)"}, ticks:{color:"#8892b0",font:{size:11}, callback:v=>fmtCompact(v,baseCurrency)}, border:{display:false}} }
    }
  });
}

function renderPlatformChart(portfolio, prices, baseCurrency) {
  const pa = calcGroupAllocation(portfolio.assets, prices, baseCurrency, a=>a.platform||"Unknown");
  platformChart = makeDoughnut("platform-chart", pa.map(p=>p.label), pa.map(p=>p.value), baseCurrency, platformChart);
}

function renderEvoChart(history, baseCurrency) {
  const el = document.getElementById("evolution-chart"); if (!el) return;
  if (evoChart) evoChart.destroy();
  if (!history?.length) { el.parentElement.innerHTML = '<div class="chart-empty">Portfolio history appears here after you refresh prices. Each refresh saves a snapshot.</div>'; return; }
  // Deduplicate to max 1 per day for display
  const daily = {};
  for (const h of history) {
    const day = h.date.split("T")[0];
    daily[day] = h.value;
  }
  const entries = Object.entries(daily).sort(([a],[b]) => a.localeCompare(b));
  const labels = entries.map(([d]) => { const dt = new Date(d); return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}); });
  const values = entries.map(([,v]) => v);

  evoChart = new Chart(el, {
    type:"line",
    data:{ labels, datasets:[{ label:"Portfolio Value", data:values, borderColor:"#4f8ef7", backgroundColor:"rgba(79,142,247,0.07)", fill:true, tension:0.4, pointRadius:values.length > 30 ? 0 : 2, pointHoverRadius:5, borderWidth:2, pointBackgroundColor:"#4f8ef7" }] },
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:"index",intersect:false},
      plugins:{ legend:{display:false}, tooltip:{...TOOLTIP, callbacks:{ label:c=>` ${fmtCurrency(c.parsed.y,baseCurrency)}` }} },
      scales:{ x:{grid:{display:false}, ticks:{color:"#8892b0",font:{size:11},maxTicksLimit:12}}, y:{grid:{color:"rgba(99,120,180,0.07)"}, ticks:{color:"#8892b0",font:{size:11},callback:v=>fmtCompact(v,baseCurrency)}, border:{display:false}} }
    }
  });
}

// ══════════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════════
function showToast(msg, type = "info") {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = `toast toast-${type}`; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add("toast-show")));
  setTimeout(() => { t.classList.remove("toast-show"); setTimeout(() => t.remove(), 350); }, 3500);
}

// ══════════════════════════════════════════════════════════════
// APP STATE
// ══════════════════════════════════════════════════════════════
let portfolio = null;
let prices = {};
let isLoading = false;

function renderAll() {
  renderDashboard(portfolio, prices);
  renderTable(portfolio, prices, handleEditAsset, handleDeleteAsset);
  destroyCharts();
  renderCharts(portfolio, prices, loadHistory());
}

async function refreshPrices() {
  if (isLoading || portfolio.assets.length === 0) return;
  isLoading = true;
  const btn = document.getElementById("btn-refresh");
  if (btn) { btn.classList.add("loading"); btn.disabled = true; }
  try {
    await fetchFxRates(getBaseCurrency());
    prices = await fetchAllPrices(portfolio.assets);
    const m = calcPortfolioMetrics(portfolio.assets, prices, getBaseCurrency());
    saveHistoryEntry(m.totalCurrentValue);
    renderAll();
    showToast("Prices updated", "success");
  } catch (e) {
    console.error(e); showToast("Error refreshing prices — some may be stale", "error");
  } finally {
    isLoading = false;
    if (btn) { btn.classList.remove("loading"); btn.disabled = false; }
  }
}

window.showAddAssetModal = function() {
  showAssetModal(null, async data => {
    portfolio.assets.push(data);
    savePortfolio(portfolio);
    await refreshPrices();
  });
};

function handleEditAsset(id) {
  const a = portfolio.assets.find(x => x.id === id); if (!a) return;
  showAssetModal(a, async data => {
    const i = portfolio.assets.findIndex(x => x.id === id);
    if (i !== -1) { portfolio.assets[i] = data; savePortfolio(portfolio); await refreshPrices(); }
  });
}

function handleDeleteAsset(id) {
  const a = portfolio.assets.find(x => x.id === id); if (!a) return;
  showConfirmModal(`Delete "<strong>${a.name}</strong>"? This cannot be undone.`, async () => {
    portfolio.assets = portfolio.assets.filter(x => x.id !== id);
    savePortfolio(portfolio); delete prices[id]; renderAll();
  });
}

function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.toggle("active", c.id === `tab-${tab}`));
  if (tab === "charts") { destroyCharts(); renderCharts(portfolio, prices, loadHistory()); }
}

// Keyboard shortcuts
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.getElementById("modal-overlay").classList.contains("active")) return;
  switch (e.key.toLowerCase()) {
    case "n": e.preventDefault(); window.showAddAssetModal(); break;
    case "r": e.preventDefault(); refreshPrices(); break;
    case "1": switchTab("dashboard"); document.querySelector('[data-tab="dashboard"]').click(); break;
    case "2": switchTab("assets"); document.querySelector('[data-tab="assets"]').click(); break;
    case "3": switchTab("charts"); document.querySelector('[data-tab="charts"]').click(); break;
  }
});

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
document.addEventListener("DOMContentLoaded", async () => {
  portfolio = loadPortfolio();
  if (!portfolio) {
    portfolio = { version:1, baseCurrency: getBaseCurrency(), updatedAt: new Date().toISOString(), assets: [] };
    savePortfolio(portfolio);
  }
  // Sync base currency from config
  portfolio.baseCurrency = getBaseCurrency();

  renderAll();

  document.getElementById("btn-add-asset").addEventListener("click", () => window.showAddAssetModal());
  document.getElementById("btn-refresh").addEventListener("click", refreshPrices);
  document.getElementById("btn-export").addEventListener("click", () => exportPortfolio(portfolio));
  document.getElementById("btn-import").addEventListener("click", () => {
    showImportModal(async file => {
      try {
        portfolio = await importPortfolio(file);
        portfolio.baseCurrency = getBaseCurrency();
        savePortfolio(portfolio); prices = {};
        await refreshPrices();
        showToast("Portfolio imported successfully", "success");
      } catch (e) { showToast(e.message, "error"); }
    });
  });
  document.getElementById("btn-settings").addEventListener("click", showSettingsModal);
  document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

  // Load prices on start
  if (portfolio.assets.length > 0) {
    await fetchFxRates(getBaseCurrency());
    await refreshPrices();
  }
});
</script>
